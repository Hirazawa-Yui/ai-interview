# ============================================
# AI模拟面试平台 - 应用配置
# ============================================

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 8080

# ============================================
# SpringDoc / Swagger 接口文档配置
# 访问地址：http://localhost:8080/swagger-ui.html
# OpenAPI JSON：http://localhost:8080/v3/api-docs
# ============================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.aiinterview

spring:
  application:
    name: ai-interview

  # 虚拟线程（Java 21）
  threads:
    virtual:
      enabled: true

  # ============================================
  # PostgreSQL + pgvector 数据库配置
  # 容器：postgres-service (port 5432)
  # 新建 ai_interview 库，与旧项目 interview_guide 隔离
  # 账号/密码走环境变量（带本地默认值），仓库内不落明文密钥，见 .env.example
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_interview
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  # 编码 & 文件上传（Spring Boot 4.x 用 spring.servlet.encoding，不再用 server.servlet.encoding）
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # ============================================
  # Redis 配置（Spring Data Redis）
  # 容器：my_redis (port 6380)
  # 使用 1 号库，与旧项目（0号库）隔离
  # 密码走环境变量（带本地默认值），见 .env.example
  # ============================================
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:123456}
      database: 1
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  # ============================================
  # Spring AI 配置（OpenAI兼容模式 → 通义千问）
  # 自动配置需要 spring.ai.openai.api-key，给占位值即可
  # 实际使用 app.ai.llm.* 中的配置（见 LlmConfig）
  # ============================================
  ai:
    openai:
      api-key: unused                          # 占位，实际由 LlmConfig 管理
    retry:
      max-attempts: 1
      on-client-errors: false
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        remove-existing-vector-store-table: false

# ============================================
# 业务自定义配置
# ============================================
app:
  # ---------- AI/LLM 配置 ----------
  ai:
    # 使用单个LLM，OpenAI兼容接口
    # API Key 走环境变量 DASHSCOPE_API_KEY（本地经 .env + IDEA EnvFile 注入），仓库不落明文
    llm:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen3.7-flash
      embedding-model: qwen3.7-text-embedding
      embedding-dimensions: 1024
      # 思考模式（T18）：qwen3 系列默认先产出完整 reasoning_content 思维链再作答，
      # 单次调用多花 1~30s；关闭后改写/作答/出题/评估/简历分析全线提速
      # （同请求实测 4.82s → 0.58s）。需要模型"想清楚"时置 true
      enable-thinking: false

    # ---------- Prompt 注入防护配置 ----------
    defense:
      sanitizer:
        enabled: true                           # 第一层：正则净化开关
      delimiter:
        enabled: true                           # 第二层：动态分隔符开关
      output-guard:
        enabled: true                           # 第三层：输出护栏开关（模式从 defense/output-guard-patterns.json 加载）

    # 结构化输出重试
    structured-max-attempts: 2
    structured-include-last-error: true
    structured-retry-use-repair-prompt: true
    structured-retry-append-strict-json-instruction: true
    structured-error-message-max-length: 200

    # RAG 检索配置
    rag:
      rewrite:
        enabled: true                         # Query Rewrite：用LLM改写用户问题提升检索命中率
        max-history-chars: 200                # 改写时注入的助手回复最大字符数（截断）
      search:
        short-query-length: 4                 # 短查询阈值（≤4字视为短查询）
        long-query-length: 16                 # 长查询阈值（≥16字视为长查询，中间为中等查询）
        topk-short: 20                        # 短查询返回片段数（关键词少，需要更多候选）
        topk-medium: 12                       # 中等查询返回片段数
        topk-long: 8                          # 长查询返回片段数（语义丰富，精确匹配为主）
        min-score-short: 0.18                 # 短查询最低相似度（阈值更低，放宽匹配）
        min-score-default: 0.28               # 默认最低相似度

  # ---------- 面试配置 ----------
  interview:
    follow-up-count: 0                          # 追问次数（0=不追问）
    question-system-prompt: classpath:prompts/interview-question-system.st
    question-user-prompt: classpath:prompts/interview-question-user.st
    evaluation:
      batch-size: 4                           # 分批评估，每批4题，避免超出LLM输出限制
      system-prompt: classpath:prompts/interview-evaluation-system.st
      user-prompt: classpath:prompts/interview-evaluation-user.st
      summary-system-prompt: classpath:prompts/interview-summary-system.st

  # ---------- 简历配置 ----------
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # ============================================
  # 阿里云 OSS 对象存储配置
  # （AWS S3 SDK S3兼容模式）
  # AccessKey/Secret 走环境变量（本地经 .env + IDEA EnvFile 注入），仓库不落明文
  # ============================================
  storage:
    enabled: true
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    bucket: ai-interview-101
    region: oss-cn-beijing

  # ---------- CORS 配置（前端地址） ----------
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:80

  # ---------- 虚拟线程 ----------
  virtual-thread:
    enabled: true
